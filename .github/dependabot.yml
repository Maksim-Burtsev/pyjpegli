version: 2
updates:
  # Action pins in .github/workflows/wheels.yml. Grouped so a week's worth of
  # bumps arrives as one PR instead of four.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # The vendored third_party/jpegli pin. Monthly: every bump costs a full
  # four-platform wheel build, and jpegli does not move fast.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
