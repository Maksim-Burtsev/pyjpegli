name: wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-14, arch: arm64 }
          - { os: macos-14, arch: x86_64 }
          - { os: windows-2022, arch: AMD64 }
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version $v"; exit 1; }

      - name: Fetch jpegli and its required submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 third_party/jpegli
          git -C third_party/jpegli submodule update --init --depth 1 \
            third_party/highway third_party/skcms third_party/libjpeg-turbo

      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Fetch jpegli and its required submodules
        run: |
          git submodule update --init --depth 1 third_party/jpegli
          git -C third_party/jpegli submodule update --init --depth 1 \
            third_party/highway third_party/skcms third_party/libjpeg-turbo

      - name: Build sdist
        run: pipx run build --sdist

      - name: Install from sdist and run tests
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/pip install pytest pillow numpy
          /tmp/sdist-venv/bin/python -m pytest tests

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish:
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --generate-notes ||
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
